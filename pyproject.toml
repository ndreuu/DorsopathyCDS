[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dorsopathy-cds"
version = "0.1.0"
description = "Traceable research rules for clinician-supported dorsopathy assessment"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dorsopathy-cds = "dorsopathy_cds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dorsopathy_cds = ["catalog/*.json"]
