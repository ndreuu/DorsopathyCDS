[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dorsopathy-cds"
version = "0.2.0"
description = "Local modular observation platform and research clinical rule engine"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dorsopathy-platform = "dorsopathy_platform.cli:main"
dorsopathy-cds = "dorsopathy_cds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dorsopathy_platform = ["schemas/v1/*.json", "web/*.html", "demo_assets/*/*"]
dorsopathy_cds = ["catalog/*.json", "web/*.html"]
